[package]
name = "excel-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
web-sys = { version = "0.3", features = ["console"] }
serde_json = "1"
console_error_panic_hook = "0.1"
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
rust_xlsxwriter = { 
  version = "0.95.0",
  features = ["wasm"]
}