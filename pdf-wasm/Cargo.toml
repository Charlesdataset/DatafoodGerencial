[package]
name = "pdf-wasm"
version = "0.1.0"
edition = "2021"
description = "PDF generator compiled to WebAssembly for ClearDataTicket"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate_pdf"
path = "src/bin/generate_pdf.rs"

[dependencies]
wasm-bindgen = "0.2"
pdf-writer = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3.95", features = ["console"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
pdf-writer = "0.14"

# Desabilita o wasm-opt bundled do wasm-pack — versao desatualizada nao
# suporta bulk-memory gerado pelo Rust 1.85+. O Vite otimiza o WASM no build.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
