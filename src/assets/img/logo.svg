  <text x="340" y="128" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="82" fill="#21455F" letter-spacing="3" style="fill:rgb(33, 69, 95);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Arial Black&quot;, Arial, sans-serif;font-size:82px;font-weight:900;text-anchor:middle;dominant-baseline:auto">DATA<tspan fill="#42AB8A" style="fill:rgb(66, 171, 138);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Arial Black&quot;, Arial, sans-serif;font-size:82px;font-weight:900;text-anchor:middle;dominant-baseline:auto">FOOD</tspan></text>

